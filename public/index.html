<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git Ticket Change Viewer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
  <div class="container-fluid h-100">
    <div class="row py-2 border-bottom">
      <div class="col">
        <h4 class="mb-0">Git Ticket Change Viewer</h4>
      </div>
    </div>

    <div class="row main-content">
      <!-- Left panel: Commits -->
      <div class="col-md-3 border-end panel-container" id="commit-panel">
        <button class="toggle-btn" id="toggle-commits" title="Toggle commits panel">‹</button>
        <div class="panel-header p-2 border-bottom">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="mb-0">Commits</h6>
            <button id="select-all-commits" class="btn btn-outline-secondary btn-sm" style="font-size: 11px; padding: 2px 8px;">
              Select All
            </button>
          </div>
          <input
            type="text"
            id="filter-input"
            class="form-control form-control-sm mb-2"
            placeholder="Filter by regex (e.g., JIRA-1234)">
          <div class="form-check form-check-sm mb-1">
            <input
              type="checkbox"
              class="form-check-input"
              id="show-filtered-only">
            <label class="form-check-label" for="show-filtered-only">
              Show only filtered commits
            </label>
          </div>
          <div class="form-check form-check-sm">
            <input
              type="checkbox"
              class="form-check-input"
              id="multi-select"
              checked>
            <label class="form-check-label" for="multi-select">
              Multi-select
            </label>
          </div>
        </div>
        <div id="commit-list" class="panel-body overflow-auto">
          <div class="text-center text-muted p-3">Loading commits...</div>
        </div>
      </div>

      <!-- Middle panel: Files -->
      <div class="col-md-2 border-end panel-container">
        <div class="panel-header p-2 border-bottom">
          <h6 class="mb-0">Changed Files</h6>
          <small class="text-muted" id="file-count">Select commits to see files</small>
        </div>
        <div id="file-list" class="panel-body overflow-auto">
          <div class="text-center text-muted p-3">
            <small>No commits selected</small>
          </div>
        </div>
      </div>

      <!-- Right panel: Diff viewer -->
      <div class="col-md-7 panel-container">
        <div class="panel-header p-2 border-bottom d-flex justify-content-between align-items-center">
          <h6 class="mb-0">
            <span id="diff-file-name">Diff Viewer</span>
          </h6>
          <div class="d-flex gap-2 align-items-center">
            <div class="form-check form-check-sm">
              <input
                type="checkbox"
                class="form-check-input"
                id="wrap-lines">
              <label class="form-check-label" for="wrap-lines" style="font-size: 12px;">
                Wrap Lines
              </label>
            </div>
            <div class="btn-group btn-group-sm" role="group">
              <button
                type="button"
                class="btn btn-outline-primary"
                id="btn-my-changes"
                data-mode="my-changes">
                My Changes Only
              </button>
              <button
                type="button"
                class="btn btn-outline-primary"
                id="btn-full-file"
                data-mode="full-file">
                Full File
              </button>
            </div>
          </div>
        </div>
        <div id="diff-viewer" class="panel-body overflow-auto">
          <div class="text-center text-muted p-3">
            <small>Select a file to view changes</small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript modules -->
  <script src="/static/js/state.js"></script>
  <script src="/static/js/commit-list.js"></script>
  <script src="/static/js/file-list.js"></script>
  <script src="/static/js/diff-viewer.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
